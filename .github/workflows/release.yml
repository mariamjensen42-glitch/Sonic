name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate CI keystore
        run: |
          keytool -genkey -v -keystore ci-release.keystore \
            -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ci123456 -keypass ci123456 \
            -dname "CN=Sonic CI, OU=CI, O=Sonic, L=Unknown, ST=Unknown, C=CN"

      - name: Build release APK
        env:
          SONIC_STORE_FILE: ci-release.keystore
          SONIC_STORE_PASSWORD: ci123456
          SONIC_KEY_ALIAS: ci
          SONIC_KEY_PASSWORD: ci123456
        run: ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonic-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
